<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Test ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts">❤️ 💕 ❤️ 💕 ❤️</div>

    <div class="container">

        <h1>💗 Love Test 💗</h1>

        <p class="question">
            How much do you love me? 🥺❤️
        </p>

        <div class="buttons">
            <button onclick="showResult(100)">100% ❤️</button>
            <button onclick="showResult(100)">Infinite ♾️</button>
        </div>

        <div id="result" class="hidden">
            <h2>💕 I knew it! 💕</h2>
            <p>Your love is <b>100%</b> ❤️</p>

            <h3>🎁 Choose a surprise 🎁</h3>

            <div class="gifts">
                <button onclick="openGift(1)">🎁</button>
                <button onclick="openGift(2)">🎁</button>
                <button onclick="openGift(3)">🎁</button>
            </div>

            <div id="message"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
